<script>
  // IMPORTANT:
  // Replace this with your actual Codespaces BACKEND port 5000 URL
  // Example:
  // const API_BASE_URL = "https://your-codespace-name-5000.app.github.dev";
  const API_BASE_URL = "https://ubiquitous-yodel-x545r795x65qfvjv4-5000.app.github.dev";
  const API_URL = `${API_BASE_URL}/api/adviser`;
  const HEALTH_URL = `${API_BASE_URL}/api/health`;
  const STUDENTS_URL = `${API_BASE_URL}/api/students`;

  const chatMessages = document.getElementById("chatMessages");
  const promptInput = document.getElementById("promptInput");
  const sendBtn = document.getElementById("sendBtn");
  const clearChatBtn = document.getElementById("clearChatBtn");
  const currentChatBtn = document.getElementById("currentChatBtn");
  const historyBtn = document.getElementById("historyBtn");
  const settingsBtn = document.getElementById("settingsBtn");
  const helpBtn = document.getElementById("helpBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const searchBtn = document.getElementById("searchBtn");
  const accountBtn = document.getElementById("accountBtn");
  const attachBtn = document.getElementById("attachBtn");
  const imageBtn = document.getElementById("imageBtn");
  const micBtn = document.getElementById("micBtn");
  const fileInput = document.getElementById("fileInput");
  const imageInput = document.getElementById("imageInput");
  const profileImageInput = document.getElementById("profileImageInput");

  const quickButtons = document.querySelectorAll(".quick-prompt");

  const settingsModal = document.getElementById("settingsModal");
  const historyModal = document.getElementById("historyModal");
  const accountModal = document.getElementById("accountModal");

  const closeSettingsBtn = document.getElementById("closeSettingsBtn");
  const closeHistoryBtn = document.getElementById("closeHistoryBtn");
  const closeAccountBtn = document.getElementById("closeAccountBtn");

  const themeSelect = document.getElementById("themeSelect");
  const fontSizeSelect = document.getElementById("fontSizeSelect");
  const historyList = document.getElementById("historyList");

  const sidebarProfileImg = document.getElementById("sidebarProfileImg");
  const sidebarUserName = document.getElementById("sidebarUserName");
  const sidebarUserEmail = document.getElementById("sidebarUserEmail");

  const accountProfileImg = document.getElementById("accountProfileImg");
  const accountName = document.getElementById("accountName");
  const accountEmail = document.getElementById("accountEmail");
  const accountMajor = document.getElementById("accountMajor");
  const accountMinor = document.getElementById("accountMinor");
  const accountClassification = document.getElementById("accountClassification");
  const accountAdvisor = document.getElementById("accountAdvisor");
  const changeProfilePicBtn = document.getElementById("changeProfilePicBtn");
  const profileCard = document.getElementById("profileCard");

  const defaultAvatar = "data:image/svg+xml;utf8," + encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
      <rect width="100%" height="100%" fill="#e2e8f0"/>
      <text x="50%" y="54%" text-anchor="middle" font-size="34" fill="#475569" font-family="Arial">👤</text>
    </svg>
  `);

  let chatHistory = JSON.parse(localStorage.getItem("msu_chat_history") || "[]");
  let settings = JSON.parse(localStorage.getItem("msu_settings") || '{"theme":"light","fontSize":"16px"}');

  function getProfile() {
    return {
      name: localStorage.getItem("msu_user_name") || "Student Name",
      email: localStorage.getItem("msu_user_email") || "student@morgan.edu",
      major: localStorage.getItem("msu_user_major") || "Computer Science",
      minor: localStorage.getItem("msu_user_minor") || "N/A",
      classification: localStorage.getItem("msu_user_classification") || "Student",
      advisor: localStorage.getItem("msu_user_advisor") || "Not set",
      picture: localStorage.getItem("msu_user_profile_pic") || defaultAvatar
    };
  }

  function saveSettings() {
    localStorage.setItem("msu_settings", JSON.stringify(settings));
  }

  function applySettings() {
    document.documentElement.classList.remove("light", "dark");
    document.documentElement.classList.add(settings.theme);
    document.body.style.fontSize = settings.fontSize;
    themeSelect.value = settings.theme;
    fontSizeSelect.value = settings.fontSize;
  }

  function renderProfile() {
    const profile = getProfile();
    sidebarUserName.textContent = profile.name;
    sidebarUserEmail.textContent = profile.email;
    sidebarProfileImg.src = profile.picture;

    accountName.textContent = profile.name;
    accountEmail.textContent = profile.email;
    accountMajor.textContent = profile.major;
    accountMinor.textContent = profile.minor || "N/A";
    accountClassification.textContent = profile.classification;
    accountAdvisor.textContent = profile.advisor || "Not set";
    accountProfileImg.src = profile.picture;
  }

  function getTime() {
    return new Date().toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit"
    });
  }

  function scrollToBottom() {
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function saveChatHistory() {
    localStorage.setItem("msu_chat_history", JSON.stringify(chatHistory));
  }

  function addUserMessage(text, skipSave = false) {
    const wrapper = document.createElement("div");
    wrapper.className = "flex justify-end";
    wrapper.innerHTML = `
      <div class="max-w-[80%] bg-primary-container text-white p-5 rounded-2xl rounded-tr-none shadow-lg">
        <p class="text-sm leading-relaxed whitespace-pre-wrap"></p>
        <span class="text-[10px] text-on-primary-container mt-2 block text-right opacity-80">${getTime()}</span>
      </div>
    `;
    wrapper.querySelector("p").textContent = text;
    chatMessages.appendChild(wrapper);
    scrollToBottom();

    if (!skipSave) {
      chatHistory.push({ role: "user", text, time: new Date().toLocaleString() });
      saveChatHistory();
    }
  }

  function addBotMessage(text, title = "MSU CS Scholar", skipSave = false) {
    const wrapper = document.createElement("div");
    wrapper.className = "flex justify-start gap-4";
    wrapper.innerHTML = `
      <div class="w-8 h-8 rounded-lg bg-secondary-container flex items-center justify-center flex-shrink-0 mt-1">
        <span class="material-symbols-outlined text-white text-sm">school</span>
      </div>
      <div class="max-w-[85%] bg-white p-6 rounded-2xl rounded-tl-none border border-slate-200/20 shadow-sm">
        <h3 class="font-headline font-bold text-primary mb-2"></h3>
        <p class="text-sm text-on-surface-variant leading-relaxed whitespace-pre-wrap"></p>
        <span class="text-[10px] text-slate-400 mt-4 block opacity-80">${getTime()}</span>
      </div>
    `;
    wrapper.querySelector("h3").textContent = title;
    wrapper.querySelector("p").textContent = text;
    chatMessages.appendChild(wrapper);
    scrollToBottom();

    if (!skipSave) {
      chatHistory.push({ role: "bot", text, title, time: new Date().toLocaleString() });
      saveChatHistory();
    }
  }

  function addTypingMessage() {
    const wrapper = document.createElement("div");
    wrapper.className = "flex justify-start gap-4";
    wrapper.id = "typingBubble";
    wrapper.innerHTML = `
      <div class="w-8 h-8 rounded-lg bg-secondary-container flex items-center justify-center flex-shrink-0 mt-1">
        <span class="material-symbols-outlined text-white text-sm">school</span>
      </div>
      <div class="bg-surface-container-low px-5 py-3 rounded-2xl rounded-tl-none flex items-center gap-2">
        <div class="w-1.5 h-1.5 bg-secondary rounded-full animate-pulse"></div>
        <div class="w-1.5 h-1.5 bg-secondary rounded-full animate-pulse"></div>
        <div class="w-1.5 h-1.5 bg-secondary rounded-full animate-pulse"></div>
        <span class="text-[10px] font-bold text-secondary ml-1 uppercase tracking-tight">Thinking...</span>
      </div>
    `;
    chatMessages.appendChild(wrapper);
    scrollToBottom();
  }

  function removeTypingMessage() {
    const typingBubble = document.getElementById("typingBubble");
    if (typingBubble) typingBubble.remove();
  }

  function renderSavedChat() {
    if (chatHistory.length === 0) return;

    chatMessages.innerHTML = `
      <div class="flex justify-center">
        <span class="text-[10px] uppercase tracking-widest text-slate-400 font-bold bg-slate-100 px-3 py-1 rounded-full">
          Restored Chat
        </span>
      </div>
    `;

    chatHistory.forEach((msg) => {
      if (msg.role === "user") {
        addUserMessage(msg.text, true);
      } else {
        addBotMessage(msg.text, msg.title || "MSU CS Scholar", true);
      }
    });
  }

  function renderHistoryModal() {
    historyList.innerHTML = "";

    if (chatHistory.length === 0) {
      historyList.innerHTML = `<p class="text-slate-500">No saved chat history yet.</p>`;
      return;
    }

    chatHistory.forEach((msg) => {
      const item = document.createElement("div");
      item.className = "border rounded-xl p-3";
      item.innerHTML = `
        <p class="text-xs uppercase tracking-wider text-slate-400 font-bold mb-1">${msg.role}</p>
        <p class="text-sm text-slate-700 whitespace-pre-wrap">${msg.text}</p>
        <p class="text-[11px] text-slate-400 mt-2">${msg.time || ""}</p>
      `;
      historyList.appendChild(item);
    });
  }

  async function checkBackendStatus() {
    try {
      const response = await fetch(HEALTH_URL);
      const data = await response.json();

      if (response.ok) {
        console.log("Backend OK:", data);
      } else {
        console.warn("Backend responded with an error:", data);
      }
    } catch (error) {
      console.error("Backend health check failed:", error);
      addBotMessage(
        "Backend connection check failed. Make sure your Flask app is running on port 5000 and API_BASE_URL points to the 5000 port.",
        "Connection Warning",
        true
      );
    }
  }

  async function sendMessage(customText = null) {
    const message = (customText || promptInput.value).trim();
    if (!message) return;

    addUserMessage(message);
    promptInput.value = "";
    sendBtn.disabled = true;
    addTypingMessage();

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          student_id: 1,
          question: message
        })
      });

      let data = {};
      try {
        data = await response.json();
      } catch {
        data = {};
      }

      removeTypingMessage();

      if (!response.ok) {
        addBotMessage(data.reply || data.error || `Server error (${response.status})`);
        return;
      }

      addBotMessage(data.reply || "No response returned.");
    } catch (error) {
      removeTypingMessage();
      console.error(error);
      addBotMessage("Frontend fetch failed: " + error.message);
    } finally {
      sendBtn.disabled = false;
      promptInput.focus();
    }
  }

  function openModal(modal) {
    modal.classList.remove("hidden");
    modal.classList.add("flex");
  }

  function closeModal(modal) {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
  }

  function startVoiceInput() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Voice input is not supported in this browser.");
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.start();

    recognition.onresult = function(event) {
      const transcript = event.results[0][0].transcript;
      promptInput.value = transcript;
      promptInput.focus();
    };

    recognition.onerror = function() {
      alert("Voice input failed. Please try again.");
    };
  }

  sendBtn.addEventListener("click", () => sendMessage());

  promptInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  quickButtons.forEach((btn) => {
    btn.addEventListener("click", () => {
      sendMessage(btn.dataset.prompt);
    });
  });

  clearChatBtn.addEventListener("click", () => {
    chatHistory = [];
    saveChatHistory();
    chatMessages.innerHTML = `
      <div class="flex justify-center">
        <span class="text-[10px] uppercase tracking-widest text-slate-400 font-bold bg-slate-100 px-3 py-1 rounded-full">
          Chat cleared
        </span>
      </div>
    `;
  });

  currentChatBtn.addEventListener("click", () => {
    chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: "smooth" });
    promptInput.focus();
  });

  historyBtn.addEventListener("click", () => {
    renderHistoryModal();
    openModal(historyModal);
  });

  settingsBtn.addEventListener("click", () => {
    openModal(settingsModal);
  });

  closeSettingsBtn.addEventListener("click", () => closeModal(settingsModal));
  closeHistoryBtn.addEventListener("click", () => closeModal(historyModal));
  closeAccountBtn.addEventListener("click", () => closeModal(accountModal));

  helpBtn.addEventListener("click", () => {
    addBotMessage("You can ask about classes, semester planning, electives, GPA, progress, and advising support.", "Help");
  });

  logoutBtn.addEventListener("click", () => {
    alert("Logged out.");
  });

  searchBtn.addEventListener("click", () => {
    promptInput.focus();
    promptInput.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  accountBtn.addEventListener("click", () => {
    renderProfile();
    openModal(accountModal);
  });

  profileCard.addEventListener("click", () => {
    renderProfile();
    openModal(accountModal);
  });

  attachBtn.addEventListener("click", () => {
    fileInput.click();
  });

  imageBtn.addEventListener("click", () => {
    imageInput.click();
  });

  micBtn.addEventListener("click", () => {
    startVoiceInput();
  });

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length > 0) {
      addBotMessage(`Selected file: ${fileInput.files[0].name}`, "File Attached");
    }
  });

  imageInput.addEventListener("change", () => {
    if (imageInput.files.length > 0) {
      addBotMessage(`Selected image: ${imageInput.files[0].name}`, "Image Attached");
    }
  });

  changeProfilePicBtn.addEventListener("click", () => {
    profileImageInput.click();
  });

  profileImageInput.addEventListener("change", () => {
    const file = profileImageInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      localStorage.setItem("msu_user_profile_pic", e.target.result);
      renderProfile();
    };
    reader.readAsDataURL(file);
  });

  themeSelect.addEventListener("change", () => {
    settings.theme = themeSelect.value;
    saveSettings();
    applySettings();
  });

  fontSizeSelect.addEventListener("change", () => {
    settings.fontSize = fontSizeSelect.value;
    saveSettings();
    applySettings();
  });

  [settingsModal, historyModal, accountModal].forEach((modal) => {
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal(modal);
    });
  });

  applySettings();
  renderProfile();
  renderSavedChat();
  checkBackendStatus();
</script>
