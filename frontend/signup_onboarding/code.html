<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MSU CS Scholar - Signup</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-lg">
    <h1 class="text-2xl font-bold text-[#00205B] mb-4">Student Onboarding</h1>

    <form id="signupForm" class="space-y-4">

      <input id="fullName" class="w-full border p-2 rounded" placeholder="Full Name" required>
      <input id="morganEmail" class="w-full border p-2 rounded" placeholder="student@morgan.edu" required>

      <select id="major" class="w-full border p-2 rounded">
        <option>Computer Science</option>
        <option>Cyber Security</option>
        <option>Cloud Computing</option>
      </select>

      <input id="minor" class="w-full border p-2 rounded" placeholder="Minor (optional)">
      <input id="advisor" class="w-full border p-2 rounded" placeholder="Advisor">

      <div class="flex gap-2">
        <button type="button" class="classification-btn border px-3 py-2 rounded" data-value="Freshman">Freshman</button>
        <button type="button" class="classification-btn border px-3 py-2 rounded" data-value="Sophomore">Sophomore</button>
        <button type="button" class="classification-btn border px-3 py-2 rounded" data-value="Junior">Junior</button>
        <button type="button" class="classification-btn border px-3 py-2 rounded" data-value="Senior">Senior</button>
      </div>

      <button type="submit" class="w-full bg-orange-500 text-white py-2 rounded">
        Complete Profile
      </button>

      <button id="backToLoginBtn" type="button" class="w-full text-blue-600">
        Back to Login
      </button>

    </form>
  </div>

<script>
  const signupForm = document.getElementById("signupForm");
  const backToLoginBtn = document.getElementById("backToLoginBtn");
  const classificationButtons = document.querySelectorAll(".classification-btn");

  let selectedClassification = "Freshman";

  classificationButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      selectedClassification = btn.dataset.value;
    });
  });

  // ✅ FIXED: BACK TO LOGIN
  backToLoginBtn.addEventListener("click", () => {
    window.location.href = "/login";
  });

  signupForm.addEventListener("submit", (e) => {
    e.preventDefault();

    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("morganEmail").value.trim();
    const major = document.getElementById("major").value;
    const minor = document.getElementById("minor").value.trim();
    const advisor = document.getElementById("advisor").value.trim();

    if (!fullName || !email) {
      alert("Please complete required fields");
      return;
    }

    if (!email.endsWith("@morgan.edu")) {
      alert("Use your Morgan email");
      return;
    }

    localStorage.setItem("msu_logged_in", "true");
    localStorage.setItem("msu_user_name", fullName);
    localStorage.setItem("msu_user_email", email);
    localStorage.setItem("msu_user_major", major);
    localStorage.setItem("msu_user_minor", minor);
    localStorage.setItem("msu_user_classification", selectedClassification);
    localStorage.setItem("msu_user_advisor", advisor);

    // ✅ FIXED: GO TO CHAT
    window.location.href = "/chat";
  });
</script>

</body>
</html>
